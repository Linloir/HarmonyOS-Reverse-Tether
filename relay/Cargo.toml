[package]
name = "harmony-relay"
version = "0.1.2"
edition = "2018"
license = "Apache-2.0"
description = "Loopback-only IPv4 TCP/UDP relay for HarmonyOS reverse tethering over HDC"
authors = ["linloir"]

[lib]
name = "relaylib"
path = "src/lib.rs"

[dependencies]
mio = "0.6"
slab = "0.4"
log = "0.4"
chrono = "0.4"
byteorder = "1.3"
rand = "0.7"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["iphlpapi", "iptypes", "winerror"] }

[profile.release]
lto = true
